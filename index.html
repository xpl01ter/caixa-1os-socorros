<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa de 1.os Socorros</title>
<style>
/*==== DESIGN PARTILHADO: INÍCIO — não editar aqui, editar _Design Partilhado/design.css ====*/
/* =====================================================================
   DESIGN PARTILHADO — Plataforma VNG (Dashboard Fumigação, Cargas e Descargas, …)
   Fonte ÚNICA das cores, tipografia, componentes e animações de todas as web apps.
   Alterar SÓ aqui e depois correr:  node "_Design Partilhado/sincronizar.js"
   (atualiza as versões (dev) de todas as apps; o original só muda ao publicar cada app).
   Estilos que só fazem sentido numa app ficam nessa app, DEPOIS deste bloco.
   ===================================================================== */
/* ============ TOKENS — todas as cores vêm daqui (tema claro/escuro) ============ */
:root{
  /* Faz o browser desenhar barras de deslocamento, menus nativos e o seletor de
     data no tom certo. Sem isto, o tema escuro tinha barras brancas. */
  color-scheme: light;
  scrollbar-color: #C3CDD8 #E3E9EF;
  --bg:#EDF1F5; --panel:#FFFFFF; --panel2:#F5F8FA; --line:#D9E0E8;
  --text:#141F2A; --muted:#5C6B7A; --accent:#155E93; --accent-ink:#FFFFFF;
  --amber:#F2A900; --stripe-dark:#1B2530; --danger:#C63238; --ok:#2F7D3B;
  --st-pedido-bg:#FBD2D8; --st-pedido-fg:#8E1220;
  --st-agfum-bg:#FBD2D8;  --st-agfum-fg:#8E1220;
  --st-emfum-bg:#FCE9A8;  --st-emfum-fg:#7E5200;
  --st-recolha-bg:#CBDDF2;--st-recolha-fg:#1E4E79;
  --st-conc-bg:#CDE8B0;   --st-conc-fg:#2C5E1A;
  --st-nao-bg:#D5393F;    --st-nao-fg:#FFFFFF;
  /* cores só para o gráfico: os tons pastel das etiquetas não têm força suficiente */
  --g-pedido:#DC3A45; --g-agfum:#F0839B; --g-emfum:#EFA100;
  --g-recolha:#2C7DC0; --g-conc:#3E9B4F; --g-nao:#8E1220;
  --alert-row:#FFF3B0; --shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px rgba(16,24,32,.06);
  --radius:10px;
  /* curvas de animação: entradas e mudanças de estado / saídas */
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.4,0,1,1);
  --mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
[data-theme="dark"]{
  color-scheme: dark;
  scrollbar-color: #3C4A5A #161E26;
  --bg:#0F151B; --panel:#161E26; --panel2:#121A22; --line:#2A3542;
  --text:#E7EDF3; --muted:#93A3B2; --accent:#4D9FDC; --accent-ink:#0B1520;
  --stripe-dark:#0B1118; --danger:#F0656B; --ok:#5FBF6E;
  --st-pedido-bg:rgba(226,72,90,.20); --st-pedido-fg:#FF9AA5;
  --st-agfum-bg:rgba(226,72,90,.20);  --st-agfum-fg:#FF9AA5;
  --st-emfum-bg:rgba(242,169,0,.18);  --st-emfum-fg:#FFD37A;
  --st-recolha-bg:rgba(77,159,220,.18);--st-recolha-fg:#9CCBF0;
  --st-conc-bg:rgba(95,191,110,.20);  --st-conc-fg:#A5E3AE;
  --st-nao-bg:#B12A30; --st-nao-fg:#FFFFFF;
  --g-pedido:#FF5A62; --g-agfum:#FF94AE; --g-emfum:#FFB524;
  --g-recolha:#57ABEA; --g-conc:#5FCC72; --g-nao:#E0464D;
  --alert-row:rgba(242,169,0,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}

/* ============ BASE ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}   /* tem de vencer qualquer display de componente */
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
h1,h2,h3{margin:0;font-weight:650}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ ANIMAÇÕES ============ */
/* entrada do separador: transição (interrompível) a partir do display:none do [hidden] */
main > section{transition:opacity .16s var(--ease-out),transform .16s var(--ease-out)}
@starting-style{main > section:not([hidden]){opacity:0;transform:translateY(4px)}}
/* botões: confirmação táctil do clique */
.btn{transition:transform .08s var(--ease-out),border-color .14s var(--ease-out)}
.btn:active:not(:disabled){transform:scale(.97)}
/* entradas únicas, só opacidade: faixa offline, caixa de erros, estado "pátio limpo" */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#offlineBanner:not([hidden]){animation:fadeIn .15s var(--ease-out)}
#regErros:not([hidden]){animation:fadeIn .12s var(--ease-out)}
@keyframes okPop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.empty-ok .ok-ico{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;font-weight:700;margin-right:7px;vertical-align:-3px;animation:okPop .2s var(--ease-out)}

/* ============ MASTHEAD (assinatura: faixa de perigo âmbar/escuro) ============ */
#topo{position:sticky;top:0;z-index:30;background:var(--bg)}
.mast{background:var(--panel);border-bottom:1px solid var(--line)}
.mast-inner{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .eyebrow{font:600 11px/1 var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.brand h1{font-size:21px;letter-spacing:-.01em;margin-top:3px}
.plate{font:700 11px/1 var(--mono);letter-spacing:.12em;border:1.5px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--muted);background:var(--panel2)}
.plate.dev{background:var(--amber);border-color:var(--amber);color:#1B2430;margin-left:6px}
.mast-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hazard{height:5px;background:repeating-linear-gradient(45deg,var(--amber) 0 12px,var(--stripe-dark) 12px 24px)}

/* ============ NAV ============ */
.tabs{max-width:1400px;margin:14px auto 0;padding:0 20px;display:flex;gap:6px}
.tab{padding:9px 16px;border-radius:8px;font-weight:600;color:var(--muted);border:1px solid transparent;transition:background-color .14s var(--ease-out),color .14s var(--ease-out),box-shadow .14s var(--ease-out)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--text);border-color:var(--line);box-shadow:0 -2px 0 var(--accent) inset}
main{max-width:1400px;margin:0 auto;padding:16px 20px 48px}
section[hidden]{display:none}

/* ============ BOTÕES ============ */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.iconbtn:hover{border-color:var(--muted)}

/* ============ DASHBOARD ============ */
.kpi-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:14px 16px;text-align:left;transition:transform .12s var(--ease-out)}
button.kpi:hover{transform:translateY(-2px);border-color:var(--muted)}
.kpi .lbl{font:600 10.5px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi .num{font:700 30px/1.1 var(--mono);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kpi.emfum{border-top:5px solid transparent;border-image:repeating-linear-gradient(45deg,var(--amber) 0 8px,var(--stripe-dark) 8px 16px) 1}
.dash-grid{display:grid;grid-template-columns:minmax(300px,1fr) minmax(330px,.95fr) minmax(620px,1.35fr);gap:12px}
.panel-h{display:flex;align-items:baseline;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:14px;white-space:nowrap}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-b{padding:14px 16px}
.legend{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px;width:100%;text-align:left;padding:4px 6px;margin:-2px 0;border-radius:6px;cursor:pointer}
.legend button.li:hover{background:var(--panel2)}
.donut-seg{cursor:pointer;transition:opacity .12s var(--ease-out)}
.donut-seg:hover{opacity:.72}
.donut-center{cursor:pointer}
.donut-center:hover{opacity:.75}
.legend .sw{width:11px;height:11px;border-radius:3px}
.legend .n{margin-left:auto;font:600 13px var(--mono)}
/* ============ MÉTRICAS ============ */
/* cores das séries: ordem fixa validada para daltonismo (claro / escuro); a cor segue a entidade, nunca a posição */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#4a3aa7;--c8:#e34948;--c-outros:#9AA6B2}
[data-theme="dark"]{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--c-outros:#5B6876}
.met-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.met-grid .full{grid-column:1/-1}
.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .tick{font:500 10.5px var(--mono);fill:var(--muted);font-variant-numeric:tabular-nums}
.viz .xlab{font:500 11px var(--sans);fill:var(--muted)}
.viz .ylab{font:500 12px var(--sans);fill:var(--text)}
.viz .tot{font:600 11px var(--mono);fill:var(--text)}
.viz .hit{fill:transparent;cursor:default;outline:none}
.viz g.col{transition:opacity .12s var(--ease-out)}
.viz.hov g.col:not(.on){opacity:.4}
.viz g.col.on .hit{fill:var(--panel2);fill-opacity:.6}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-bottom:10px}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.vlegend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
/* pragas: botões da legenda que excluem/incluem a série; a desligada fica esbatida e riscada */
.vlegend button.lg{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;margin:-2px -6px;border-radius:6px;font-size:12.5px;transition:opacity .12s var(--ease-out),background-color .12s var(--ease-out)}
.vlegend button.lg:hover{background:var(--panel2)}
.vlegend button.lg.off{opacity:.5;text-decoration:line-through}
.vlegend button.lg.off i{background:transparent!important;outline:1.5px solid var(--muted);outline-offset:-1.5px}
.viz-tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 11px;font-size:12px;min-width:150px;opacity:0;transition:opacity .1s var(--ease-out)}
.viz-tip.on{opacity:1}
.viz-tip .h{color:var(--muted);display:flex;justify-content:space-between;gap:14px;margin-bottom:5px}
.viz-tip .h b{color:var(--text);font:700 13px var(--mono)}
.viz-tip .r{display:flex;align-items:center;gap:7px;line-height:1.7}
.viz-tip .r i{width:10px;height:2px;border-radius:1px;flex:0 0 auto}
.viz-tip .r span{color:var(--muted)}
.viz-tip .r b{margin-left:auto;padding-left:12px;font:700 12px var(--mono)}
/* entrada: barras crescem da base (colunas) ou da esquerda (barras), em cascata curta por coluna;
   os números aparecem quando a barra chega. Com "reduzir movimento" fica tudo estático (regra global). */
@keyframes vizCresceY{from{transform:scaleY(0)}}
@keyframes vizCresceX{from{transform:scaleX(0)}}
.viz .barras{transform-box:fill-box;transform-origin:50% 100%}
.viz .barras.h{transform-origin:0 50%}
.viz.entra .barras{animation:vizCresceY .36s var(--ease-out) var(--d,0ms) both}
.viz.entra .barras.h{animation-name:vizCresceX}
.viz.entra .tot{animation:fadeIn .18s var(--ease-out) calc(var(--d,0ms) + .26s) both}
/* lotes descarregados: barra de fundo clara atrás de cada coluna */
.viz .fundo{fill:var(--line)}
.vlegend i.fundo,.viz-tip .r i.fundo{background:var(--line);outline:1px solid var(--muted);outline-offset:-1px}
.viz-tip .r i.fundo{height:6px}
.viz-tip .r.tt{border-top:1px solid var(--line);margin-top:3px;padding-top:3px}
.viz-tip .r.tt + .r.tt{border-top:0;margin-top:0;padding-top:0}
.vtab summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:10px;width:max-content}
.vtab summary:hover{color:var(--text)}
.vtab .wrap{overflow-x:auto;margin-top:8px}
.vtab table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:0}   /* a tabela principal tem min-width:1180px */
.vtab th,.vtab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.vtab th:first-child,.vtab td:first-child{text-align:left}
.vtab th{color:var(--muted);font:600 11.5px/1.25 var(--sans);letter-spacing:0;text-transform:none;white-space:normal;vertical-align:bottom;position:static}
.vtab th,.vtab td{padding:5px 6px}
.vtab tr:last-child td{font-weight:700;border-bottom:0}
@media (max-width:980px){.met-grid{grid-template-columns:minmax(0,1fr)}}
.mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini-list li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.mini-list li:last-child{border-bottom:0}
.mini-list li:has(.rowlink){padding:0}
.rowlink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 6px;border-radius:7px;font-size:13px}
.rowlink:hover{background:var(--panel2)}
.rowlink:hover .code{color:var(--accent);text-decoration:underline}
.rowlink .tail{margin-left:auto}
.mini-list .code{font-family:var(--mono);font-weight:600;white-space:nowrap}
.mini-list .sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini-list .tail{margin-left:auto}
.empty{color:var(--muted);padding:18px 4px;font-size:13px}
.badge-dias{font:700 12px var(--mono);color:var(--st-pedido-fg);background:var(--st-pedido-bg);border-radius:6px;padding:3px 8px;white-space:nowrap}
.badge-hora{font:700 12px var(--mono);color:var(--st-emfum-fg);background:var(--st-emfum-bg);border-radius:6px;padding:3px 8px;white-space:nowrap}
.badge-ok{font:700 12px var(--mono);color:var(--st-conc-fg);background:var(--st-conc-bg);border-radius:6px;padding:3px 8px;white-space:nowrap}
button.nfum{font:inherit;color:inherit;padding:2px 8px;border-radius:6px;min-width:28px}
button.nfum:hover{background:var(--panel2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
tr.rowclick{cursor:pointer}
#tbody tr.rowclick td.selcol{cursor:default}   /* zona da checkbox, não de abertura */
tr.rowclick:hover .code,tr.rowclick:hover td.code{color:var(--accent)}

/* ============ TABELA REGISTOS ============ */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:180px}
.count{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow)}
/* Sem altura própria, o invólucro crescia com o conteúdo, quem rolava era a
   página e o cabeçalho fixo da tabela não tinha a que se agarrar. */
#sec-reg .tbl-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font:600 10.5px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
thead th.nosort{cursor:default}
thead th .arr{opacity:.9;font-family:var(--sans)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:var(--panel2)}
tbody tr.alerta{background:var(--alert-row)}
td.code,td.date{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.num{text-align:right;font-family:var(--mono)}
td.numc{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
thead th.center{text-align:center}
thead th.filtercol.center{padding-left:26px}   /* simetria com o espaço do botão de filtro */
.pill{display:inline-block;padding:3.5px 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap}
.par{color:var(--st-pedido-fg);background:var(--st-pedido-bg);border-radius:6px;padding:2px 8px;font:700 12px var(--mono)}
.chk{width:16px;height:16px;accent-color:var(--accent)}
th.selcol,td.selcol{width:38px;text-align:center;padding-left:12px}

/* ---- filtros tipo Excel ---- */
thead th.filtercol{padding-right:26px;position:sticky;top:0}
.fbtn{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:19px;height:19px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);border:1px solid transparent}
.fbtn:hover{background:var(--panel);border-color:var(--line);color:var(--text)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#agMenu{position:absolute;z-index:40;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:none;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;transition:opacity .14s var(--ease-out),transform .14s var(--ease-out),display .14s allow-discrete,overlay .14s allow-discrete}
#agMenu.open{display:block;opacity:1;transform:none}
#agMenu.flip{transform-origin:top right}
@starting-style{#agMenu.open{opacity:0;transform:scale(.96) translateY(-4px)}}
#agMenu button{display:block;width:100%;text-align:left;padding:8px 11px;border-radius:7px;font-size:13px;font-weight:600}
#agMenu button:hover{background:var(--panel2);color:var(--accent)}
#fpop{position:absolute;z-index:40;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;display:none;opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;transition:opacity .14s var(--ease-out),transform .14s var(--ease-out),display .14s allow-discrete,overlay .14s allow-discrete}
#fpop.open{display:block;opacity:1;transform:none}
#fpop.flip{transform-origin:top right}
@starting-style{#fpop.open{opacity:0;transform:scale(.96) translateY(-4px)}}
#fpop .fp-h{display:flex;gap:6px;margin-bottom:8px}
#fpop input[type=search]{flex:1;min-width:0;padding:5px 8px;font-size:12.5px}
#fpop .fp-list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
#fpop label{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;font-size:12.5px;cursor:pointer;font-weight:500;text-transform:none;letter-spacing:0;font-family:var(--sans);color:var(--text)}
#fpop label:hover{background:var(--panel2)}
#fpop label.all{border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;font-weight:650}
#fpop .fp-f{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#fpop .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--muted)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 10px}
.fchip b{font-weight:650}
.fchip button{width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:10px}
.fchip button:hover{background:var(--panel2);color:var(--danger)}

/* ---- painel contentores vazios ---- */
.vz-tot{font:700 12px var(--mono);background:var(--st-conc-bg);color:var(--st-conc-fg);border-radius:6px;padding:3px 9px;margin-left:auto}
.tag-sem{font:600 11px var(--mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}

/* ============ SUPORTE ============ */
.sup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.sup-tbl{width:100%;min-width:0}
.sup-tbl td,.sup-tbl th{padding:7px 8px}
.sup-tbl tr.inativo{opacity:.5}
.sup-tbl td.selcol{padding-right:0;width:1%}
/* Emails dos pedidos: um bloco por lista */
.eml-bloco + .eml-bloco{margin-top:16px}
.eml-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:13px}
.eml-bloco .sup-tbl{border:1px solid var(--line);border-radius:8px;border-collapse:separate;border-spacing:0;overflow:hidden}
.eml-bloco .sup-tbl input{width:100%}
.eml-add{display:flex;gap:8px;margin-top:8px}
.eml-add input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:340px;overflow:auto;padding:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.chip button{color:var(--muted);line-height:1}
.chip button:hover{color:var(--danger)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--amber);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0;margin-top:12px}
.warn{color:var(--danger);font-weight:700}

/* ============ MODAIS ============ */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:0;max-width:640px;width:calc(100vw - 32px);box-shadow:var(--shadow);opacity:0;transform:scale(.96) translateY(6px);transition:opacity .18s var(--ease-out),transform .18s var(--ease-out),display .18s allow-discrete,overlay .18s allow-discrete}
/* transform:none (e não scale(1)): qualquer outro valor prende os avisos fixos dentro do diálogo */
dialog[open]{opacity:1;transform:none}
@starting-style{dialog[open]{opacity:0;transform:scale(.96) translateY(6px)}}
/* Estas duas têm 4 botões no rodapé; com 640px o último passava para a linha
   de baixo. O flex-wrap fica como rede para ecrãs estreitos. */
#dlgMail{max-width:880px}
#dlgReg{max-width:1000px}
dialog::backdrop{background:rgba(10,16,22,.5);backdrop-filter:blur(2px);opacity:0;transition:opacity .18s var(--ease-out),display .18s allow-discrete,overlay .18s allow-discrete}
dialog[open]::backdrop{opacity:1}
@starting-style{dialog[open]::backdrop{opacity:0}}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:15px}
.dlg-h .iconbtn{margin-left:auto;border:0}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:600 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field.full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.estado-preview{font-size:12.5px;color:var(--muted)}
#regErros{border-left:3px solid var(--danger);background:var(--panel2);border-radius:0 8px 8px 0;padding:9px 12px}
#regErros ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.5}
#regErros li{margin-bottom:5px}
#regErros li:last-child{margin-bottom:0}
input,select{transition:border-color .14s var(--ease-out),box-shadow .14s var(--ease-out)}
input.invalido,select.invalido{border-color:var(--danger);box-shadow:0 0 0 2px rgba(198,50,56,.14)}
.datawrap{position:relative;display:flex}
.datawrap input{flex:1;min-width:0}
.hojebtn{position:absolute;top:50%;right:32px;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;width:24px;height:22px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0}
.hojebtn:hover{color:var(--accent);border-color:var(--accent)}
.hojebtn:disabled{opacity:.4;cursor:not-allowed}
/* O ícone do calendário já vem claro por via do color-scheme; só se afina a opacidade */
[data-theme="dark"] .datawrap input::-webkit-calendar-picker-indicator{opacity:.7}
[data-theme="dark"] .datawrap input::-webkit-calendar-picker-indicator:hover{opacity:1}
.mail-meta{font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-bottom:12px}
.mail-meta dt{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.mail-meta dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-all}
.mail-prev{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:230px}
.mail-prev table{min-width:0;font-size:12.5px}
.mail-prev th{position:static;cursor:default}
.mail-prev{background:#fff;color:#1F1F1F;padding:14px;max-height:300px;color-scheme:light;scrollbar-color:#C3CDD8 #EDEDED}
.recarga-chks{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
#cargaLinhas{display:flex;flex-direction:column;gap:7px}
.carga-lin{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.carga-lin .code{font:600 12.5px var(--mono);min-width:110px}
.carga-lin .lote{font-size:12.5px;color:var(--muted);flex:1}
.carga-lin .datawrap{width:230px;flex:0 0 auto}
.recarga-chks label{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--mono);cursor:pointer}
.recarga-chks .lote{font-family:var(--sans);font-weight:500;color:var(--muted)}
[data-theme="dark"] .mail-prev{filter:none}
details.sig{margin-top:12px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--panel2)}
details.sig summary{cursor:pointer;font-weight:650;font-size:13px}
details.sig summary::marker{color:var(--muted)}

.pq-state{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13px}
.pq-state .led{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--muted);transition:background-color .2s var(--ease-out)}
.pq-state.on .led{background:var(--ok)}
.pq-state.warn .led{background:var(--danger)}
.pq-state code,.dlg-b code{font:600 12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.pq-state .path{font-family:var(--mono);font-size:12px;word-break:break-all}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.sync .led{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background-color .2s var(--ease-out)}
.sync.ok .led{background:var(--ok)} .sync.err .led{background:var(--danger)}
.sync.err{color:var(--danger);font-weight:600}
#roAviso{background:var(--st-recolha-bg);color:var(--st-recolha-fg);border-bottom:1px solid var(--line);padding:9px 20px;font-size:13px;font-weight:600}
body.consulta .chk{pointer-events:none;opacity:.45}
body.consulta #tbody tr.rowclick .selcol{opacity:.45}
#offlineBanner{background:var(--st-pedido-bg);color:var(--st-pedido-fg);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
#offlineBanner button{border:1px solid currentColor;border-radius:7px;padding:3px 10px;font-size:12.5px;font-weight:650}
.autor{font:11px var(--mono);color:var(--muted)}
.dlg-b h4{margin:16px 0 8px;font-size:13px}
.dlg-b h4:first-child{margin-top:0}
.dlg-b ol{margin:0 0 0 18px;padding:0;font-size:13px;color:var(--muted)}
.dlg-b ol li{margin-bottom:5px}

/* ============ TOAST / RODAPÉ ============ */
#toasts,.toast-layer{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;font-size:13px;box-shadow:var(--shadow);animation:tin .18s var(--ease-out);display:flex;align-items:center;gap:12px;transition:opacity .16s var(--ease-in),transform .16s var(--ease-in)}
.toast.out{opacity:0;transform:translateY(6px)}
/* o contorno mostra o tempo que falta (pára com o rato por cima) */
.toast{position:relative}
.toast .t-tempo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.toast .t-tempo rect{x:1px;y:1px;width:calc(100% - 2px);height:calc(100% - 2px);rx:8px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;animation:toastTempo var(--t-ms,3000ms) linear forwards}
.toast.pausa .t-tempo rect{animation-play-state:paused}
@keyframes toastTempo{to{stroke-dashoffset:100}}
.toast button{border:1px solid currentColor;border-radius:7px;padding:2px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.toast button:hover{background:var(--bg);color:var(--text)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{max-width:1400px;margin:0 auto;padding:0 20px 28px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
footer .mono{font-family:var(--mono)}

#descSub{white-space:nowrap}
@media (max-width:1320px){.dash-grid{grid-template-columns:minmax(300px,1fr) 1fr}.dash-grid > .card:nth-child(3){grid-column:1/-1}}
@media (max-width:640px){#descSub{white-space:normal}}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr}.sup-grid{grid-template-columns:1fr}.kpi-band{grid-template-columns:1fr 1fr}.fgrid{grid-template-columns:1fr}}
.fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.field{min-width:0}
@media (max-width:980px){.fgrid{grid-template-columns:minmax(0,1fr)}}

/* ============ IMPRESSÃO ============ */
@media print{
  body{background:#fff;color:#000}
  .mast-actions,.tabs,.toolbar,footer,#toasts,.hazard{display:none!important}
  main{padding:0;max-width:none}
  section[hidden]{display:none!important}
  .tbl-wrap,#sec-reg .tbl-wrap{border:0;box-shadow:none;overflow:visible;max-height:none!important}
  #topo{position:static}
  table{min-width:0;font-size:11px}
  thead th{position:static}
  th.selcol,td.selcol,.fbtn,.fchips{display:none!important}
}
/*==== DESIGN PARTILHADO: FIM — estilos só desta app a seguir ====*/

.cx-mt{margin-top:11px}
.cx-acoes-janela{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.cx-erro-login{margin:10px 0 0}
.cx-toast-erro{background:var(--st-nao-bg);color:var(--st-nao-fg)}

.cx-medio{background:var(--st-emfum-bg);color:var(--st-emfum-fg)}
.cx-bom{background:var(--st-conc-bg);color:var(--st-conc-fg)}
.cx-neutro{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.cx-atencao{color:var(--st-emfum-fg);font-weight:700}
.cx-erro p,.cx-concluido p{margin:0 0 12px}

/* Caixa */
.cx-kpi-valor{font:700 19px/1.2 var(--mono);margin-top:6px;font-variant-numeric:tabular-nums}
.cx-materiais,.cx-linhas{list-style:none;margin:0;padding:0}
.cx-material{padding:12px 16px;border-top:1px solid var(--line)}
.cx-material:first-child{border-top:0}
.cx-material-topo{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.cx-material-topo strong{flex:1 1 220px;min-width:0}
.cx-qtd{font:700 15px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-qtd small{font-size:12px;font-weight:500;color:var(--muted)}
.cx-linhas{margin-top:6px}
.cx-linhas li{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:3px 0;font-size:13px;color:var(--muted)}
.cx-validade{font-family:var(--mono);font-size:12.5px}

/* Registo */
.cx-registo{max-width:860px;margin:0 auto}
.cx-responsavel{padding:7px 0;overflow-wrap:anywhere;color:var(--muted)}
.cx-sn{display:flex;flex-wrap:wrap;gap:6px;border:0;margin:0;padding:0;min-width:0}
.cx-sn legend{padding:0 0 4px;font:600 10.5px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cx-sn label{flex:1 1 0;cursor:pointer}
.cx-sn input{position:absolute;opacity:0;width:1px;height:1px}
.cx-sn span{display:block;min-height:40px;padding:9px 12px;text-align:center;font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:8px;transition:background-color .14s var(--ease-out),border-color .14s var(--ease-out)}
.cx-sn input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cx-sn input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.cx-foto{display:block;max-width:100%;max-height:220px;margin:8px 0;border-radius:8px;border:1px solid var(--line)}
.cx-foto-aviso{margin:4px 0 0}
.cx-reg-materiais{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.cx-reg-h{flex-wrap:wrap}
.cx-reg-h h3{white-space:normal;min-width:0}
.cx-reg-total{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono)}
.cx-reg-linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 34px;gap:4px 10px;align-items:end;margin-bottom:10px}
.cx-reg-linha input{width:100%}
.cx-linha-pill{grid-column:1/-1}
.cx-linha-pill:empty{display:none}
.cx-reg-rodape{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cx-reposto{width:110px}
.cx-reposto input{width:100%}
#regErros{margin-top:12px}
.cx-reg-final{display:flex;justify-content:flex-end;margin-top:14px}
.cx-resumo{margin:0;padding-left:18px;font-size:13px}
.cx-gravar-erro{margin-top:12px}
.cx-gravar-erro p{margin:0 0 8px}

@media (max-width:640px){
  #topo{position:static}
  .mast-inner{padding:12px 16px;gap:10px}
  .plate{display:none}
  .mast-actions{margin-left:0;width:100%}

  .cx-reg-linha{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 40px}
}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

      setupPositionProbePattern(_moduleCount - 7, 0);

      }

      if (_dataCache == null) {

      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )

          } else {
            _modules[row + r][col + c] = false;
          }

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;

      for (var r = 8; r < _moduleCount - 8; r += 1) {

        }

        }

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

/* Regras da app, sem acesso à página nem à rede. Testes: node --test Testes/regras.test.js
   Formato de uma linha: {quantidade: inteiro | null (não contado), validade: "YYYY-MM-DD" | null}. */
/*REGRAS:INÍCIO*/
const DIAS_A_EXPIRAR = 30;

function _temValor(v){ return v !== null && v !== undefined && v !== ""; }

function _inteiroNaoNegativo(v){
  const n = Number(v);
  return _temValor(v) && Number.isInteger(n) && n >= 0;
}

function _isoParaUTC(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof iso === "string" ? iso : "");
  if(!m) return null;
  const y = +m[1], mes = +m[2], d = +m[3], t = Date.UTC(y, mes - 1, d);
  const dt = new Date(t);
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === mes - 1 && dt.getUTCDate() === d ? t : null;
}

function _validadeValida(v){
  return _isoParaUTC(v) !== null || mesAnoParaData(v) !== null;
}

function _hojeLisboa(){
  return new Intl.DateTimeFormat("en-CA", {timeZone: "Europe/Lisbon", year: "numeric", month: "2-digit", day: "2-digit"}).format(new Date());
}

function _novoUUID(){
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

/* soma das linhas; null só se nenhuma estiver contada */
function totalMaterial(linhas){
  let total = null;
  for(const l of linhas || []){
    if(_temValor(l.quantidade) && Number.isFinite(Number(l.quantidade))) total = (total ?? 0) + Number(l.quantidade);
  }
  return total;
}

/* "expirada" | "a-expirar" (30 dias ou menos) | "ok"; uma linha com quantidade 0 não dá aviso */
function estadoLinha(linha, hojeISO){
  if(_temValor(linha.quantidade) && Number(linha.quantidade) === 0) return "ok";
  const v = _isoParaUTC(linha.validade), h = _isoParaUTC(hojeISO);
  if(v === null || h === null) return "ok";
  const dias = Math.round((v - h) / 86400000);
  if(dias < 0) return "expirada";
  return dias <= DIAS_A_EXPIRAR ? "a-expirar" : "ok";
}

function abaixoMinimo(total, minimo){
  return total !== null && total !== undefined && total < minimo;
}

/* consumo = total anterior + reposto − total atual, nunca abaixo de 0 */
function consumo(anterior, reposto, atual){
  if(anterior === null || anterior === undefined || atual === null || atual === undefined) return null;
  return Math.max(0, anterior + (Number(reposto) || 0) - atual);
}

/* "12/2030" → "2030-12-31" (último dia do mês); inválido → null */
function mesAnoParaData(texto){
  const m = /^(\d{1,2})\/(\d{4})$/.exec(typeof texto === "string" ? texto.trim() : "");
  if(!m || +m[1] < 1 || +m[1] > 12) return null;
  return new Date(Date.UTC(+m[2], +m[1], 0)).toISOString().slice(0, 10);
}

function dataParaMesAno(iso){
  const m = /^(\d{4})-(\d{2})/.exec(typeof iso === "string" ? iso : "");
  return m ? `${m[2]}/${m[1]}` : "";
}

/* compara cada verificação com a anterior do mesmo material; o consumo conta no ano da mais recente */
function consumosPorAno(historico){
  const ordenado = [...(historico || [])].sort((a, b) => String(a.data).localeCompare(String(b.data)));
  const anterior = new Map(), somas = new Map();
  for(const v of ordenado){
    const ano = Number(String(v.data).slice(0, 4));
    for(const item of v.itens || []){
      const atual = totalMaterial(item.linhas);
      if(anterior.has(item.material_id)){
        const q = consumo(anterior.get(item.material_id), item.reposto, atual);
        if(q !== null){
          const chave = `${ano}|${item.material_id}`;
          const s = somas.get(chave) || {ano, material: item.nome, quantidade: 0};
          s.quantidade += q;
          somas.set(chave, s);
        }
      }
      anterior.set(item.material_id, atual);
    }
  }
  return [...somas.values()].sort((a, b) => a.ano - b.ano || String(a.material).localeCompare(String(b.material), "pt"));
}

/* devolve as mensagens de erro; [] = pode gravar. A quantidade tem de ser contada em todas as linhas. */
function validarRegisto(rascunho, materiais){
  const erros = [];
  if(_isoParaUTC(rascunho.data) === null) erros.push("Indique a data da verificação.");
  const perguntas = {bom_estado: "Bom estado", sinalizada: "Sinalizada", local_definido: "Local definido"};
  for(const campo of Object.keys(perguntas)){
    if(!_temValor(rascunho[campo])) erros.push(`Responda a "${perguntas[campo]}".`);
  }
  const itens = new Map((rascunho.itens || []).map(i => [i.material_id, i]));
  const ativos = (materiais || []).filter(m => m.ativo).sort((a, b) => a.ordem - b.ordem);
  for(const m of ativos){
    const item = itens.get(m.id);
    if(!item || !item.linhas || !item.linhas.length){
      erros.push(`${m.nome}: falta a quantidade.`);
      continue;
    }
    if(_temValor(item.reposto) && !_inteiroNaoNegativo(item.reposto)) erros.push(`${m.nome}: "Reposto" tem de ser um número inteiro, 0 ou superior.`);
    item.linhas.forEach((l, i) => {
      const onde = `${m.nome}, linha ${i + 1}`;
      if(!_inteiroNaoNegativo(l.quantidade)) erros.push(`${onde}: a quantidade tem de ser um número inteiro, 0 ou superior.`);
      if(_temValor(l.validade)){
        if(!_validadeValida(l.validade)) erros.push(`${onde}: validade inválida (use mês/ano, por exemplo 12/2030).`);
      }else if(m.validade_obrigatoria && _inteiroNaoNegativo(l.quantidade) && Number(l.quantidade) > 0){
        erros.push(`${onde}: falta a validade.`);
      }
    });
  }
  return erros;
}

/* formulário novo, com as linhas atuais da caixa: o verificador só corrige o que mudou.
   Linhas a 0 não passam: quem repuser indica a validade nova. Materiais ligados pelo nome,
   porque cx_estado_publico não expõe ids. */
function novoRascunho(estado, materiais, hojeISO){
  const porNome = new Map(((estado && estado.materiais) || []).map(m => [m.nome, m]));
  const ativos = (materiais || []).filter(m => m.ativo).sort((a, b) => a.ordem - b.ordem);
  return {
    pedido_id: _novoUUID(),
    data: hojeISO || _hojeLisboa(),
    bom_estado: null,
    sinalizada: null,
    local_definido: null,
    foto: null,
    itens: ativos.map(m => {
      const atuais = (porNome.get(m.nome) || {}).linhas || [];
      const linhas = atuais.filter(l => l.quantidade === null || l.quantidade > 0).map(l => ({quantidade: l.quantidade, validade: l.validade}));
      if(!linhas.length) linhas.push({quantidade: atuais.length ? 0 : null, validade: null});
      return {material_id: m.id, nome: m.nome, reposto: 0, linhas};
    }),
  };
}

/* obrigatório em todo o texto inserido em HTML */
function esc(texto){
  const mapa = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
  return String(texto ?? "").replace(/[&<>"']/g, c => mapa[c]);
}

/* ---------- Sessão ---------- */
function expiracaoDoToken(dados){
  if(dados.expires_at) return Number(dados.expires_at);
  if(dados.expires_in) return Math.floor(Date.now() / 1000) + Number(dados.expires_in);
  try{
    const parte = dados.access_token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(atob(parte)).exp || 0;
  }catch(e){ return 0; }
}
const Sessao = {
  _memoria: null,
  atual(){
    if(!this._memoria) this._memoria = Local.ler(CHAVE_SESSAO);
    return this._memoria;
  },
  definir(dados, emailConhecido){
    const anterior = this.atual() || {};
    this._memoria = {
      email: dados.email || (dados.user && dados.user.email) || emailConhecido || anterior.email || "",
      access_token: dados.access_token,
      refresh_token: dados.refresh_token || anterior.refresh_token,
      expires_at: expiracaoDoToken(dados)
    };
    Local.gravar(CHAVE_SESSAO, this._memoria);
    atualizarSessaoNoTopo();
  },
  limpar(){
    this._memoria = null;
    Local.apagar(CHAVE_SESSAO);
    atualizarSessaoNoTopo();
  },
  async entrar(email, password){
    const dados = await API.pedir("entrar", {email, password});
    this.definir(dados, email);
  },
  async sair(){
    try{ await API.pedir("sair"); }catch(e){ /* a sessão local termina na mesma */ }
    this.limpar();
  }
};

/* ---------- API ---------- */
const API = {
  _renovacao: null,
  async _enviar(acao, dados){
    const s = Sessao.atual();
    const ctl = new AbortController();
    const prazo = setTimeout(() => ctl.abort(), acao === "foto-enviar" ? 45000 : 20000);
    let resposta;
    try{
      resposta = await fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({acao, sessao: s ? s.access_token : null, dados: dados === undefined ? null : dados}),
        signal: ctl.signal
      });
    }catch(e){
      const erro = new Error("Sem ligação ao servidor. Verifique a rede e tente novamente.");
      erro.status = 0;
      throw erro;
    }finally{ clearTimeout(prazo); }
    let corpo = null;
    try{ corpo = await resposta.json(); }catch(e){}
    if(!resposta.ok || !corpo || corpo.ok !== true){
      const erro = new Error((corpo && corpo.erro) || "Ocorreu um erro no servidor. Tente novamente.");
      erro.status = resposta.status;
      throw erro;
    }
    return corpo.dados;
  },
  /* só uma renovação de cada vez. Sem rede, a sessão mantém-se para se tentar depois. */
  _renovar(){
    if(!this._renovacao){
      const s = Sessao.atual();
      this._renovacao = (async () => {
        if(!s || !s.refresh_token){ const e = new Error("A sessão terminou. Inicie sessão novamente."); e.status = 401; throw e; }
        try{
          Sessao.definir(await this._enviar("renovar", {refresh_token: s.refresh_token}));
        }catch(e){
          if(e.status === 0) throw e;
          Sessao.limpar();
          const fim = new Error("A sessão terminou. Inicie sessão novamente.");
          fim.status = 401;
          throw fim;
        }
      })().finally(() => { this._renovacao = null; });
    }
    return this._renovacao;
  },
  async pedir(acao, dados){
    const semRenovar = acao === "entrar" || acao === "renovar" || acao === "estado";
    const s = Sessao.atual();
    if(!semRenovar && s && s.expires_at && s.expires_at - Date.now() / 1000 < 60) await this._renovar();
    try{
      return await this._enviar(acao, dados);
    }catch(e){
      if(e.status === 401 && !semRenovar && Sessao.atual()){
        await this._renovar();
        return await this._enviar(acao, dados);
      }
      throw e;
    }
  }
};

/* ---------- Avisos ---------- */
function toast(texto, tipo){
  let camada = document.getElementById("toasts");
  if(!camada){
    camada = document.createElement("div");
    camada.id = "toasts";
    camada.setAttribute("role", "status");
    camada.setAttribute("aria-live", "polite");
    document.body.appendChild(camada);
  }
  const t = document.createElement("div");
  t.className = "toast" + (tipo ? " cx-toast-" + tipo : "");
  t.textContent = texto;
  camada.appendChild(t);
  setTimeout(() => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 200);
  }, tipo === "erro" ? 7000 : 4000);
}

/* ---------- Janelas ---------- */
function abrirJanela(titulo, conteudo, opcoes){
  const d = document.createElement("dialog");
  const h = document.createElement("div");
  h.className = "dlg-h";
  const t = document.createElement("h3");
  t.textContent = titulo;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "iconbtn";
  x.setAttribute("aria-label", "Fechar");
  x.textContent = "✕";
  h.append(t, x);
  const b = document.createElement("div");
  b.className = "dlg-b";
  if(typeof conteudo === "string") b.innerHTML = conteudo;
  else if(conteudo) b.appendChild(conteudo);
  d.append(h, b);
  document.body.appendChild(d);
  let fechada = false;
  const fechar = () => {
    if(fechada) return;
    fechada = true;
    if(d.open) d.close();
    d.remove();
    if(opcoes && opcoes.aoFechar) opcoes.aoFechar();
  };
  x.addEventListener("click", fechar);
  d.addEventListener("cancel", e => { e.preventDefault(); fechar(); });
  d.showModal();
  return {fechar, elemento: b, dialogo: d};
}

  const botao = f.querySelector("button[type=submit]"), erro = f.querySelector(".cx-erro-login");
  const anterior = Sessao.atual();
  if(anterior && anterior.email) f.querySelector("#cxEmail").value = anterior.email;
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if(botao.disabled) return;
    const email = f.querySelector("#cxEmail").value.trim(), pass = f.querySelector("#cxPass").value;
    erro.hidden = true;
    if(!email || !pass){ erro.textContent = "Indique o email e a palavra-passe."; erro.hidden = false; return; }
    botao.disabled = true;
    try{
      await Sessao.entrar(email, pass);
      entrou = true;
      j.fechar();
      if(aoEntrar) aoEntrar();
    }catch(ex){
      erro.textContent = ex.status === 0 ? ex.message : (ex.status === 400 || ex.status === 401 ? "Email ou palavra-passe incorretos." : ex.message);
      erro.hidden = false;
      botao.disabled = false;
    }
  });
  (f.querySelector("#cxEmail").value ? f.querySelector("#cxPass") : f.querySelector("#cxEmail")).focus();
  return j;
}

/* ---------- Separadores ---------- */
const Separadores = {lista: {}, atual: null};
function registarSeparador(sep){ Separadores.lista[sep.id] = sep; }
function separadorAtual(){ return Separadores.atual; }

function atualizarSeparadoresVisiveis(){
  const comSessao = !!Sessao.atual();
  document.querySelectorAll(".tabs .tab").forEach(b => {
    const sep = Separadores.lista[b.dataset.sep];
    /* o separador aberto não desaparece se a sessão expirar: o trabalho em curso continua visível */
    b.hidden = !!sep.requerLogin && !comSessao && sep.id !== Separadores.atual;
    b.setAttribute("aria-selected", sep.id === Separadores.atual ? "true" : "false");
  });
  const nav = document.querySelector(".tabs");
  if(nav) nav.hidden = [...nav.querySelectorAll(".tab")].filter(b => !b.hidden).length < 2;
}
function atualizarSessaoNoTopo(){
  const rotulo = document.getElementById("cxSessaoTxt");
  if(!rotulo) return;
  const s = Sessao.atual();
  rotulo.textContent = s ? (s.email || "Sessão iniciada") : "Iniciar Sessão";
  atualizarSeparadoresVisiveis();
}
function mostrarSeparador(id){
  const sep = Separadores.lista[id];
  Separadores.atual = id;
  document.querySelectorAll("main > section").forEach(s => { s.hidden = s.id !== "sec-" + id; });
  atualizarSeparadoresVisiveis();
  const alvo = "#" + id;
  if(location.hash !== alvo) history.replaceState(null, "", alvo);
  window.scrollTo(0, 0);
  sep.render(document.getElementById("sec-" + id));
}
function irPara(id){
  const sep = Separadores.lista[id] || Separadores.lista.caixa;
  if(sep.requerLogin && !Sessao.atual()){
    pedirLogin(() => mostrarSeparador(sep.id), () => { if(!Separadores.atual || Separadores.lista[Separadores.atual].requerLogin && !Sessao.atual()) mostrarSeparador("caixa"); else history.replaceState(null, "", "#" + Separadores.atual); });
    return;
  }
  mostrarSeparador(sep.id);
}

/* ---------- Tema ---------- */
function aplicarTema(tema){
  document.documentElement.setAttribute("data-theme", tema);
  const b = document.getElementById("themeBtn");
  if(b) b.textContent = tema === "dark" ? "☀️" : "🌙";
}
function temaInicial(){
  const guardado = Local.ler(CHAVE_TEMA);
  if(guardado === "dark" || guardado === "light") return guardado;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
