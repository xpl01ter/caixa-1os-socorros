/* ===== SEPARADOR CAIXA (público) ===== */
(function(){
  const MAX_IDADE_MS = 5 * 60 * 1000;
  let elementoAtual = null, pedidoAtual = 0, carregadoEm = 0;

  const simNao = v => v === true ? "Sim" : v === false ? "Não" : "—";

  function kpi(rotulo, valor, classe, detalhe){
    return `<div class="card kpi"><div class="lbl">${esc(rotulo)}</div><div class="cx-kpi-valor ${classe || ""}">${esc(valor)}</div>${detalhe ? `<div class="hint">${esc(detalhe)}</div>` : ""}</div>`;
  }
  function kpiProxima(proxima, hoje){
    if(!proxima) return kpi("Próxima verificação", "—");
    const dias = Math.round((Date.parse(proxima) - Date.parse(hoje)) / 86400000);
    if(dias < 0) return kpi("Próxima verificação", fmtData(proxima), "warn", "Em atraso");
    if(dias <= 7) return kpi("Próxima verificação", fmtData(proxima), "cx-atencao", "A vencer");
    return kpi("Próxima verificação", fmtData(proxima));
  }
  function pillLinha(estado){
    if(estado === "expirada") return `<span class="pill cx-mau">Expirada</span>`;
    if(estado === "a-expirar") return `<span class="pill cx-medio">A expirar</span>`;
    return "";
  }
  function linhaHtml(linha, hoje){
    const qtd = linha.quantidade === null || linha.quantidade === undefined ? "não contado" : linha.quantidade + (linha.quantidade === 1 ? " unidade" : " unidades");
    const validade = linha.validade ? dataParaMesAno(linha.validade) : "sem validade";
    return `<li><span>${esc(qtd)}</span><span class="cx-validade">${esc(validade)}</span>${pillLinha(estadoLinha(linha, hoje))}</li>`;
  }
  function materialHtml(m, hoje){
    /* linhas com quantidade 0 não têm unidades na caixa: o total já diz que está vazio */
    const linhas = (m.linhas || []).filter(l => l.quantidade !== 0 && (l.validade || l.quantidade === null || l.quantidade === undefined));
    const total = m.total === null || m.total === undefined ? null : m.total;
    const falta = abaixoMinimo(total, m.minimo);
    const estado = total === null ? `<span class="pill cx-neutro">Não contado</span>`
      : falta ? `<span class="pill cx-mau">Abaixo do mínimo</span>` : `<span class="pill cx-bom">OK</span>`;
    return `<li class="cx-material">
      <div class="cx-material-topo">
        <strong>${esc(m.nome)}</strong>
        <span class="cx-qtd${falta ? " warn" : ""}">${total === null ? "—" : esc(total)} <small>/ mín. ${esc(m.minimo)}</small></span>
        ${estado}
      </div>
      ${linhas.length ? `<ul class="cx-linhas">${linhas.map(l => linhaHtml(l, hoje)).join("")}</ul>` : ""}
    </li>`;
  }

  function mostrarErro(el){
    el.innerHTML = `<div class="card panel-b cx-erro" role="alert">
      <p class="warn">Não foi possível obter os dados. Tente novamente.</p>
      <button type="button" class="btn primary">Tentar novamente</button></div>`;
    el.querySelector("button").addEventListener("click", () => carregar(el));
  }
  function mostrarDados(el, e){
    const hoje = hojeLisboa();
    const hora = new Intl.DateTimeFormat("pt-PT", {timeZone: "Europe/Lisbon", hour: "2-digit", minute: "2-digit"}).format(new Date());
    el.innerHTML = `
      <div class="kpi-band">
        ${kpi("Última verificação", fmtData(e.ultima))}
        ${kpiProxima(e.proxima, hoje)}
        ${kpi("Bom estado", simNao(e.bom_estado), e.bom_estado === false ? "warn" : "")}
        ${kpi("Sinalizada", simNao(e.sinalizada), e.sinalizada === false ? "warn" : "")}
        ${kpi("Local definido", simNao(e.local_definido), e.local_definido === false ? "warn" : "")}
      </div>
      <div class="card">
        <div class="panel-h"><h3>Materiais</h3><span class="sub">Atualizado às ${esc(hora)}</span></div>
        ${(e.materiais || []).length
          ? `<ul class="cx-materiais">${e.materiais.map(m => materialHtml(m, hoje)).join("")}</ul>`
          : `<p class="empty panel-b">Ainda não há materiais registados.</p>`}
      </div>`;
  }
  async function carregar(el){
    const pedido = ++pedidoAtual;
    el.innerHTML = `<p class="empty" role="status">A carregar…</p>`;
    try{
      const estado = await API.pedir("estado");
      if(pedido !== pedidoAtual) return;
      carregadoEm = Date.now();
      mostrarDados(el, estado);
    }catch(e){
      if(pedido !== pedidoAtual) return;
      carregadoEm = 0;
      mostrarErro(el);
    }
  }

  registarSeparador({
    id: "caixa", titulo: "Caixa", requerLogin: false,
    render(el){ elementoAtual = el; carregar(el); }
  });

  /* num telemóvel a página pode ficar aberta horas: ao voltar, não mostra dados antigos como atuais */
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible" && separadorAtual() === "caixa" && elementoAtual && Date.now() - carregadoEm > MAX_IDADE_MS) carregar(elementoAtual);
  });
})();

/* ===== SEPARADOR REGISTO (com login) ===== */
(function(){
  const CHAVE_RASCUNHO = "cx_rascunho", CHAVE_FOTO = "cx_rascunho_foto";
  const FOTO_MAX_LADO = 1600, FOTO_MAX_BYTES = 2 * 1024 * 1024;
  const CAMPOS_SN = [["bom_estado", "Bom estado"], ["sinalizada", "Sinalizada"], ["local_definido", "Local definido"]];
  let el = null, r = null, mats = [], fotoB64 = null, pedidoAtual = 0, aGravar = false, avisouArmazenamento = false;

  /* ---------- Rascunho ---------- */
  function guardar(){
    if(!r) return;
    r._materiais = mats;
    if(!Local.gravar(CHAVE_RASCUNHO, r) && !avisouArmazenamento){
      avisouArmazenamento = true;
      toast("Não foi possível guardar o rascunho neste dispositivo. Não feche a página antes de gravar.", "erro");
    }
  }
  function apagarRascunho(){
    Local.apagar(CHAVE_RASCUNHO);
    Local.apagar(CHAVE_FOTO);
    r = null;
    fotoB64 = null;
  }
  /* cada material ativo tem um item com pelo menos uma linha; os inativos saem */
  function conciliar(rascunho, materiais){
    const porId = new Map((rascunho.itens || []).map(i => [String(i.material_id), i]));
    rascunho.itens = materiais.map(m => {
      const item = porId.get(String(m.id)) || {material_id: m.id, reposto: 0, linhas: []};
      if(!Array.isArray(item.linhas) || !item.linhas.length) item.linhas = [{quantidade: null, validade: null}];
      if(item.reposto === undefined || item.reposto === null) item.reposto = 0;
      return item;
    });
    if(!rascunho.data) rascunho.data = hojeLisboa();
    return rascunho;
  }
  const itemDe = id => r.itens.find(i => String(i.material_id) === String(id));
  const materialDe = id => mats.find(m => String(m.id) === String(id));
  const textoValidade = l => l._txt !== undefined ? l._txt : (l.validade ? dataParaMesAno(l.validade) : "");

  function payload(){
    return {
      pedido_id: r.pedido_id, data: r.data,
      bom_estado: r.bom_estado, sinalizada: r.sinalizada, local_definido: r.local_definido,
      foto: r.foto || null,
      itens: r.itens.map(i => ({
        material_id: i.material_id,
        reposto: i.reposto || 0,
        linhas: i.linhas.map(l => ({quantidade: l.quantidade, validade: l.validade || null}))
      }))
    };
  }
  function errosDoFormulario(){
    /* uma validade mal escrita segue como texto, para as regras a indicarem como inválida */
    const aValidar = payload();
    aValidar.itens.forEach((item, i) => item.linhas.forEach((l, n) => {
      if(!l.validade) l.validade = textoValidade(r.itens[i].linhas[n]) || null;
    }));
    const erros = validarRegisto(aValidar, mats);
    if(r.data && r.data > hojeLisboa()) erros.push("A data da verificação não pode ser futura.");
    return erros;
  }

  /* ---------- Foto ---------- */
  function reduzirFoto(ficheiro){
    return new Promise((resolver, rejeitar) => {
      const url = URL.createObjectURL(ficheiro), img = new Image();
      img.onerror = () => { URL.revokeObjectURL(url); rejeitar(new Error("imagem inválida")); };
      img.onload = () => {
        try{
          const escala = Math.min(1, FOTO_MAX_LADO / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.naturalWidth * escala));
          c.height = Math.max(1, Math.round(img.naturalHeight * escala));
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          let dados = c.toDataURL("image/jpeg", .8);
          if(dados.length * .75 > FOTO_MAX_BYTES) dados = c.toDataURL("image/jpeg", .6);
          if(!dados.startsWith("data:image/jpeg") || dados.length * .75 > FOTO_MAX_BYTES) throw new Error("imagem demasiado grande");
          resolver(dados.split(",")[1]);
        }catch(e){ rejeitar(e); }
      };
      img.src = url;
    });
  }
  function desenharFoto(){
    const caixa = el.querySelector(".cx-foto-estado");
    if(!caixa) return;
    if(fotoB64){
      caixa.innerHTML = `<img class="cx-foto" alt="Pré-visualização da foto" src="data:image/jpeg;base64,${fotoB64}"><button type="button" class="btn small" data-acao="remover-foto">Remover foto</button>`;
    }else if(r.foto){
      caixa.innerHTML = `<span class="hint">Foto já enviada.</span> <button type="button" class="btn small" data-acao="remover-foto">Remover foto</button>`;
    }else caixa.innerHTML = "";
  }
  async function escolherFoto(input){
    const f = input.files && input.files[0];
    if(!f) return;
    const aviso = el.querySelector(".cx-foto-aviso");
    aviso.hidden = true;
    try{
      fotoB64 = await reduzirFoto(f);
      r.foto = null;
      guardar();
      if(!Local.gravar(CHAVE_FOTO, fotoB64)) Local.apagar(CHAVE_FOTO);
    }catch(e){
      fotoB64 = null;
      r.foto = null;
      guardar();
      Local.apagar(CHAVE_FOTO);
      aviso.textContent = "Não foi possível processar esta foto. Pode escolher outra ou gravar sem foto.";
      aviso.hidden = false;
    }
    input.value = "";
    desenharFoto();
  }

  /* ---------- Formulário ---------- */
  function pillTotal(total, minimo){
    if(total === null) return `<span class="pill cx-neutro">Por contar</span>`;
    return abaixoMinimo(total, minimo) ? `<span class="pill cx-mau">Abaixo do mínimo</span>` : `<span class="pill cx-bom">OK</span>`;
  }
  function pillLinha(l){
    const e = estadoLinha(l, hojeLisboa());
    return e === "expirada" ? `<span class="pill cx-mau">Expirada</span>` : e === "a-expirar" ? `<span class="pill cx-medio">A expirar</span>` : "";
  }
  function linhaHtml(m, l, n){
    const id = `${m.id}-${n}`;
    return `<div class="cx-reg-linha" data-l="${n}">
      <div class="field"><label for="q-${esc(id)}">Quantidade</label><input id="q-${esc(id)}" class="cx-q" type="text" inputmode="numeric" autocomplete="off" value="${l.quantidade === null || l.quantidade === undefined ? "" : esc(l.quantidade)}"></div>
      <div class="field"><label for="v-${esc(id)}">Validade${m.validade_obrigatoria ? "" : " (opcional)"}</label><input id="v-${esc(id)}" class="cx-v" type="text" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="mm/aaaa" value="${esc(textoValidade(l))}"></div>
      <button type="button" class="iconbtn" data-acao="remover-linha" aria-label="Remover linha">✕</button>
      <div class="cx-linha-pill">${pillLinha(l)}</div>
    </div>`;
  }
  function cartaoHtml(m){
    const item = itemDe(m.id);
    return `<div class="card cx-reg-material" data-m="${esc(m.id)}">
      <div class="panel-h cx-reg-h"><h3>${esc(m.nome)}</h3><span class="sub">mín. ${esc(m.minimo)}</span><span class="cx-reg-total">${totalHtml(m, item)}</span></div>
      <div class="panel-b">
        ${item.linhas.map((l, n) => linhaHtml(m, l, n)).join("")}
        <div class="cx-reg-rodape">
          <button type="button" class="btn small" data-acao="adicionar-linha">+ Adicionar validade</button>
          <div class="field cx-reposto"><label for="r-${esc(m.id)}">Reposto</label><input id="r-${esc(m.id)}" class="cx-r" type="text" inputmode="numeric" autocomplete="off" value="${esc(item.reposto || 0)}"></div>
        </div>
      </div>
    </div>`;
  }
  function totalHtml(m, item){
    const t = totalMaterial(item.linhas);
    return `<strong>${t === null ? "—" : esc(t)}</strong> ${pillTotal(t, m.minimo)}`;
  }
  function desenharFormulario(aviso){
    const s = Sessao.atual();
    el.innerHTML = `
      ${aviso || ""}
      <form class="cx-registo" novalidate>
        <div class="card">
          <div class="panel-h"><h3>Dados gerais</h3></div>
          <div class="panel-b fgrid">
            <div class="field"><label for="cxData">Data</label><input id="cxData" type="date" max="${hojeLisboa()}" value="${esc(r.data)}"></div>
            <div class="field"><label>Responsável</label><div class="cx-responsavel">${esc((s && s.email) || "—")}</div></div>
            ${CAMPOS_SN.map(([campo, rotulo]) => `
              <fieldset class="cx-sn"><legend>${esc(rotulo)}</legend>
                <label><input type="radio" name="${campo}" value="sim"${r[campo] === true ? " checked" : ""}><span>Sim</span></label>
                <label><input type="radio" name="${campo}" value="nao"${r[campo] === false ? " checked" : ""}><span>Não</span></label>
              </fieldset>`).join("")}
            <div class="field full"><label for="cxFoto">Foto de evidência (opcional)</label><input id="cxFoto" type="file" accept="image/*"><p class="warn cx-foto-aviso" role="alert" hidden></p><div class="cx-foto-estado"></div></div>
          </div>
        </div>
        <p class="note">A quantidade é a que fica na caixa no fim da verificação, já depois de repor. Em "Reposto", indique as unidades colocadas nesta verificação.</p>
        <div class="cx-reg-materiais">${mats.map(cartaoHtml).join("")}</div>
        <div id="regErros" role="alert" hidden></div>
        <div class="cx-reg-final"><button type="submit" class="btn primary">Rever e gravar</button></div>
      </form>`;
    desenharFoto();
    const f = el.querySelector("form");
    f.addEventListener("input", aoEscrever);
    f.addEventListener("change", aoMudar);
    f.addEventListener("click", aoClicar);
    f.addEventListener("submit", e => { e.preventDefault(); rever(); });
    const rec = el.querySelector("[data-acao=recomecar]");
    if(rec) rec.addEventListener("click", recomecar);
  }
  function redesenharCartao(idMaterial, focarLinha){
    const antigo = el.querySelector(`[data-m="${CSS.escape(String(idMaterial))}"]`);
    const t = document.createElement("template");
    t.innerHTML = cartaoHtml(materialDe(idMaterial)).trim();
    antigo.replaceWith(t.content.firstChild);
    if(focarLinha !== undefined){
      const novo = el.querySelector(`[data-m="${CSS.escape(String(idMaterial))}"] [data-l="${focarLinha}"] .cx-q`);
      if(novo) novo.focus();
    }
  }
  function aoEscrever(e){
    const a = e.target;
    if(a.id === "cxData"){ r.data = a.value; guardar(); return; }
    const cartao = a.closest("[data-m]");
    if(!cartao) return;
    const item = itemDe(cartao.dataset.m), m = materialDe(cartao.dataset.m);
    if(a.classList.contains("cx-r")){
      a.value = a.value.replace(/\D/g, "");
      item.reposto = a.value === "" ? 0 : parseInt(a.value, 10);
    }else{
      const caixa = a.closest("[data-l]");
      if(!caixa) return;
      const l = item.linhas[+caixa.dataset.l];
      if(a.classList.contains("cx-q")){
        a.value = a.value.replace(/\D/g, "");
        l.quantidade = a.value === "" ? null : parseInt(a.value, 10);
      }else if(a.classList.contains("cx-v")){
        const d = a.value.replace(/\D/g, "").slice(0, 6);
        a.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
        l._txt = a.value;
        l.validade = mesAnoParaData(a.value);
      }
      caixa.querySelector(".cx-linha-pill").innerHTML = pillLinha(l);
      cartao.querySelector(".cx-reg-total").innerHTML = totalHtml(m, item);
    }
    guardar();
  }
  function aoMudar(e){
    const a = e.target;
    if(a.type === "radio"){ r[a.name] = a.value === "sim"; guardar(); }
    else if(a.id === "cxFoto") escolherFoto(a);
  }
  function aoClicar(e){
    const b = e.target.closest("[data-acao]");
    if(!b) return;
    if(b.dataset.acao === "remover-foto"){
      fotoB64 = null;
      r.foto = null;
      Local.apagar(CHAVE_FOTO);
      guardar();
      desenharFoto();
      return;
    }
    const cartao = b.closest("[data-m]");
    if(!cartao) return;
    const item = itemDe(cartao.dataset.m);
    if(b.dataset.acao === "adicionar-linha"){
      item.linhas.push({quantidade: null, validade: null});
      guardar();
      redesenharCartao(cartao.dataset.m, item.linhas.length - 1);
    }else if(b.dataset.acao === "remover-linha"){
      const n = +b.closest("[data-l]").dataset.l;
      /* cada material fica sempre com uma linha: a última limpa-se em vez de sair */
      if(item.linhas.length > 1) item.linhas.splice(n, 1);
      else item.linhas[0] = {quantidade: null, validade: null};
      guardar();
      redesenharCartao(cartao.dataset.m);
    }
  }
  function recomecar(){
    const c = document.createElement("div");
    c.innerHTML = `<p>O rascunho e os valores já escritos são apagados.</p><div class="cx-acoes-janela"><button type="button" class="btn danger">Apagar rascunho</button></div>`;
    const j = abrirJanela("Recomeçar o registo?", c);
    c.querySelector("button").addEventListener("click", () => {
      apagarRascunho();
      j.fechar();
      carregar();
    });
  }

  /* ---------- Rever e gravar ---------- */
  function rever(){
    const caixa = el.querySelector("#regErros"), erros = errosDoFormulario();
    if(erros.length){
      caixa.innerHTML = `<ul>${erros.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
      caixa.hidden = false;
      caixa.scrollIntoView({block: "center"});
      return;
    }
    caixa.hidden = true;
    const hoje = hojeLisboa(), falta = [], expiradas = [], aExpirar = [];
    r.itens.forEach(i => {
      const m = materialDe(i.material_id), total = totalMaterial(i.linhas);
      if(abaixoMinimo(total, m.minimo)) falta.push(`${m.nome}: ${total} de ${m.minimo}`);
      i.linhas.forEach(l => {
        if(!l.validade) return;
        const e = estadoLinha(l, hoje), txt = `${m.nome}: ${l.quantidade} · ${dataParaMesAno(l.validade)}`;
        if(e === "expirada") expiradas.push(txt);
        else if(e === "a-expirar") aExpirar.push(txt);
      });
    });
    const bloco = (titulo, lista) => lista.length ? `<h4>${esc(titulo)}</h4><ul class="cx-resumo">${lista.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
    const c = document.createElement("div");
    c.innerHTML = `
      ${bloco("Abaixo do mínimo", falta)}${bloco("Expirados", expiradas)}${bloco("A expirar em 30 dias ou menos", aExpirar)}
      ${falta.length + expiradas.length + aExpirar.length ? "" : `<p class="empty-ok"><span class="ok-ico">✓</span>Sem materiais em falta nem validades a tratar.</p>`}
      <div class="cx-gravar-erro" role="alert" hidden></div>
      <div class="cx-acoes-janela"><button type="button" class="btn" data-acao="voltar">Voltar</button><button type="button" class="btn primary" data-acao="gravar">Confirmar e gravar</button></div>`;
    const j = abrirJanela(`Verificação de ${fmtData(r.data)}`, c);
    c.querySelector("[data-acao=voltar]").addEventListener("click", j.fechar);
    c.querySelector("[data-acao=gravar]").addEventListener("click", () => gravar(j, c));
  }
  function mostrarErroGravar(c, mensagem, botoesHtml){
    const caixa = c.querySelector(".cx-gravar-erro");
    caixa.innerHTML = `<p class="warn">${esc(mensagem)}</p>${botoesHtml || ""}`;
    caixa.hidden = false;
  }
  async function gravar(j, c){
    if(aGravar) return;
    aGravar = true;
    const botao = c.querySelector("[data-acao=gravar]");
    botao.disabled = true;
    botao.textContent = "A gravar…";
    c.querySelector(".cx-gravar-erro").hidden = true;
    const libertar = texto => { aGravar = false; botao.disabled = false; botao.textContent = texto; };
    try{
      if(fotoB64 && !r.foto){
        try{
          const res = await API.pedir("foto-enviar", {base64: fotoB64});
          r.foto = res.caminho;
          guardar();
        }catch(e){
          if(e.status === 401) throw e;
          libertar("Tentar novamente");
          mostrarErroGravar(c, "Não foi possível enviar a foto. Pode tentar novamente ou gravar sem foto.", `<button type="button" class="btn small" data-acao="sem-foto">Gravar sem foto</button>`);
          c.querySelector("[data-acao=sem-foto]").addEventListener("click", () => {
            fotoB64 = null;
            Local.apagar(CHAVE_FOTO);
            guardar();
            desenharFoto();
            gravar(j, c);
          });
          return;
        }
      }
      /* o mesmo pedido_id em qualquer repetição: o servidor nunca cria duas verificações */
      await API.pedir("verificacao", payload());
      apagarRascunho();
      aGravar = false;
      j.fechar();
      toast("Verificação gravada.");
      mostrarConcluido();
    }catch(e){
      libertar("Tentar novamente");
      guardar();
      if(e.status === 401){
        mostrarErroGravar(c, "A sessão terminou. O rascunho está guardado: inicie sessão para continuar.", `<button type="button" class="btn small" data-acao="login">Iniciar sessão</button>`);
        c.querySelector("[data-acao=login]").addEventListener("click", () => pedirLogin(() => gravar(j, c)));
      }else{
        mostrarErroGravar(c, `${e.message} O rascunho continua guardado.`);
      }
    }
  }
  function mostrarConcluido(){
    el.innerHTML = `<div class="card panel-b cx-concluido">
      <p class="empty-ok"><span class="ok-ico">✓</span>Verificação gravada.</p>
      <button type="button" class="btn primary">Ver a caixa</button></div>`;
    el.querySelector("button").addEventListener("click", () => irPara("caixa"));
  }

  /* ---------- Carregamento ---------- */
  function mostrarFalha(mensagem, comLogin){
    el.innerHTML = `<div class="card panel-b cx-erro" role="alert"><p class="warn">${esc(mensagem)}</p>
      <button type="button" class="btn primary">${comLogin ? "Iniciar sessão" : "Tentar novamente"}</button></div>`;
    el.querySelector("button").addEventListener("click", () => comLogin ? pedirLogin(carregar) : carregar());
  }
  async function carregar(){
    const pedido = ++pedidoAtual;
    if(aGravar) return;
    const guardado = Local.ler(CHAVE_RASCUNHO);
    fotoB64 = guardado ? Local.ler(CHAVE_FOTO) : null;
    el.innerHTML = `<p class="empty" role="status">A carregar…</p>`;
    let estado;
    try{
      const lidos = await API.pedir("materiais");
      if(!guardado) estado = await API.pedir("estado");
      if(pedido !== pedidoAtual) return;
      mats = (lidos || []).filter(m => m.ativo !== false).sort((a, b) => a.ordem - b.ordem);
    }catch(e){
      if(pedido !== pedidoAtual) return;
      if(e.status === 401){ mostrarFalha("A sessão terminou. Os dados escritos continuam guardados: inicie sessão para continuar.", true); return; }
      if(guardado && Array.isArray(guardado._materiais) && guardado._materiais.length){
        /* sem rede no armazém: continua-se com a lista guardada no rascunho */
        mats = guardado._materiais;
        r = conciliar(guardado, mats);
        desenharFormulario(`<p class="note" role="status">Sem ligação: a mostrar o rascunho guardado neste dispositivo.</p>`);
        return;
      }
      mostrarFalha(e.message);
      return;
    }
    r = conciliar(guardado || novoRascunho(estado, mats, hojeLisboa()), mats);
    guardar();
    desenharFormulario(guardado ? `<p class="note" role="status">Rascunho recuperado. <button type="button" class="btn small" data-acao="recomecar">Recomeçar</button></p>` : "");
  }

  registarSeparador({
    id: "registo", titulo: "Registo", requerLogin: true,
    render(elemento){ el = elemento; carregar(); }
  });
})();

/* ============ SEPARADOR HISTÓRICO ============ */
(function(){
  "use strict";
  let pedidoAtual = 0;

  const fmtData = iso => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? `${m[3]}/${m[2]}/${m[1]}` : "—";
  };
  const simNao = v => v === true ? "Sim" : v === false ? "Não" : "—";
  const emFalta = (v, minimos) => (v.itens || []).filter(it => {
    const min = minimos.get(it.material_id);
    return min != null && abaixoMinimo(totalMaterial(it.linhas || []), min);
  }).length;
  const naoConformes = v => [v.bom_estado, v.sinalizada, v.local_definido].filter(x => x === false).length;

  function etiquetaEstado(v){
    const n = naoConformes(v);
    return n
      ? `<span class="badge-dias">${n} não conforme${n > 1 ? "s" : ""}</span>`
      : `<span class="badge-ok">Conforme</span>`;
  }

  function etiquetaLinha(linha, data){
    const e = estadoLinha(linha, String(data || "").slice(0, 10));
    if(e === "expirada") return `<span class="badge-dias">Expirada</span>`;
    if(e === "a-expirar") return `<span class="badge-hora">A expirar</span>`;
    return `<span class="badge-ok">OK</span>`;
  }

  function tabelaDetalhe(v){
    const linhas = [];
    for(const it of v.itens || []){
      const ls = it.linhas && it.linhas.length ? it.linhas : [{quantidade: null, validade: null}];
      ls.forEach((l, i) => {
        linhas.push(`<tr>
          <td>${i === 0 ? esc(it.nome) : ""}</td>
          <td class="num">${l.quantidade == null ? "Não contado" : esc(String(l.quantidade))}</td>
          <td class="date">${l.validade ? esc(dataParaMesAno(l.validade)) : "—"}</td>
          <td>${l.validade ? etiquetaLinha(l, v.data) : "—"}</td>
          <td class="num">${i === 0 ? esc(String(it.reposto || 0)) : ""}</td>
        </tr>`);
      });
    }
    return `<div class="tbl-wrap"><table class="sup-tbl">
      <thead><tr><th>Material</th><th>Quantidade</th><th>Validade</th><th>Estado na data</th><th>Reposto</th></tr></thead>
      <tbody>${linhas.join("") || `<tr><td colspan="5" class="empty">Sem materiais registados.</td></tr>`}</tbody>
    </table></div>`;
  }

  function abrirDetalhe(v){
    const corpo = document.createElement("div");
    corpo.innerHTML = `
      <ul class="mini-list">
        <li><span class="sub">Responsável</span><span class="tail">${esc(v.responsavel || "—")}</span></li>
        <li><span class="sub">Bom estado</span><span class="tail">${simNao(v.bom_estado)}</span></li>
        <li><span class="sub">Sinalizada</span><span class="tail">${simNao(v.sinalizada)}</span></li>
        <li><span class="sub">Local definido</span><span class="tail">${simNao(v.local_definido)}</span></li>
      </ul>
      <h4>Materiais</h4>
      ${tabelaDetalhe(v)}
      <h4>Foto de evidência</h4>
      <div data-foto>${v.foto ? `<button class="btn small" type="button" data-ver-foto>Ver foto</button>` : `<p class="hint">Sem foto nesta verificação.</p>`}</div>`;

    const btn = corpo.querySelector("[data-ver-foto]");
    if(btn) btn.addEventListener("click", async () => {
      btn.disabled = true;
      try{
        const r = await API.pedir("foto-ver", {caminho: v.foto});
        if(!r || !/^https:\/\//i.test(r.url || "")) throw new Error("Endereço da foto inválido.");
        const img = document.createElement("img");
        img.alt = `Foto de evidência da verificação de ${fmtData(v.data)}`;
        img.style.cssText = "display:block;max-width:100%;height:auto;border-radius:var(--radius);border:1px solid var(--line)";
        img.onerror = () => {
          img.remove();
          btn.hidden = false;
          btn.disabled = false;
          toast("Não foi possível abrir a foto. O endereço temporário pode ter expirado.", "erro");
        };
        btn.hidden = true;
        corpo.querySelector("[data-foto]").append(img);
        img.src = r.url;
      }catch(e){
        btn.disabled = false;
        toast(e.message || "Não foi possível obter a foto.", "erro");
      }
    });
    abrirJanela(`Verificação de ${fmtData(v.data)}`, corpo);
  }

  function desenhar(el, historico, minimos){
    if(!historico.length){
      el.innerHTML = `<div class="card"><div class="panel-b"><p class="empty">Ainda não há verificações registadas.</p></div></div>`;
      return;
    }
    const linhas = historico.map((v, i) => {
      const n = emFalta(v, minimos);
      return `<tr>
        <td class="date">${esc(fmtData(v.data))}</td>
        <td>${esc(v.responsavel || "—")}</td>
        <td>${etiquetaEstado(v)}</td>
        <td class="numc">${n ? `<span class="par">${n}</span>` : "0"}</td>
        <td>${v.foto ? "Sim" : "—"}</td>
        <td><button class="btn small" type="button" data-i="${i}">Ver detalhe</button></td>
      </tr>`;
    }).join("");
    el.innerHTML = `
      <div class="toolbar"><span class="count">${historico.length} verificaç${historico.length === 1 ? "ão" : "ões"}</span></div>
      <div class="tbl-wrap"><table class="sup-tbl">
        <thead><tr><th>Data</th><th>Responsável</th><th>Estado</th><th class="center">Materiais em falta</th><th>Foto</th><th></th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
      <p class="hint" style="margin-top:8px">"Materiais em falta" compara cada contagem com o mínimo atual. Os materiais não contados não entram nesta conta.</p>`;
    el.querySelector("tbody").addEventListener("click", ev => {
      const b = ev.target.closest("button[data-i]");
      if(b) abrirDetalhe(historico[Number(b.dataset.i)]);
    });
  }

  async function carregar(el){
    const pedido = ++pedidoAtual;
    el.innerHTML = `<p class="empty">A carregar o histórico…</p>`;
    try{
      const [historico, materiais] = await Promise.all([API.pedir("historico"), API.pedir("materiais")]);
      if(pedido !== pedidoAtual) return;
      const minimos = new Map((materiais || []).map(m => [m.id, m.minimo]));
      desenhar(el, historico || [], minimos);
    }catch(e){
      if(pedido !== pedidoAtual) return;
      el.innerHTML = `<div class="card"><div class="panel-b">
        <p class="empty">Não foi possível obter o histórico. ${esc(e.message || "")}</p>
        <button class="btn" type="button" data-repetir>Tentar novamente</button>
      </div></div>`;
      el.querySelector("[data-repetir]").addEventListener("click", () => carregar(el));
    }
  }

  registarSeparador({id: "historico", titulo: "Histórico", requerLogin: true, render: carregar});
})();

/* ============ SEPARADOR CONSUMOS ============ */
/* Uma só série (consumo por material num ano): barras horizontais, com o nome por cima de cada barra para
   caber no telemóvel. Sem legenda, porque o título identifica a série. Cor validada com o validador de dataviz. */
(function(){
  "use strict";
  let pedidoAtual = 0, observador = null;

  function dica(){
    let t = document.getElementById("cxVizTip");
    if(!t){
      t = document.createElement("div");
      t.id = "cxVizTip";
      t.className = "viz-tip";
      t.setAttribute("aria-hidden", "true");
      document.body.append(t);
    }
    return t;
  }
  function esconderDica(){
    const t = document.getElementById("cxVizTip");
    if(t) t.classList.remove("on");
  }
  function mostrarDica(linha, x, y){
    const t = dica();
    t.innerHTML = `<div class="h"><span>${esc(linha.material)}</span></div>
      <div class="r"><i style="background:var(--c1)"></i><span>Consumo</span><b>${esc(String(linha.quantidade))}</b></div>`;
    t.classList.add("on");
    const r = t.getBoundingClientRect();
    t.style.left = Math.max(8, Math.min(x + 12, innerWidth - r.width - 8)) + "px";
    t.style.top = Math.max(8, Math.min(y + 12, innerHeight - r.height - 8)) + "px";
  }

  /* barra ancorada à esquerda, com a ponta de dados arredondada a 4 px */
  function barra(x, y, w, h){
    const r = Math.min(4, w, h / 2);
    return `M${x} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h - r}Q${x + w} ${y + h} ${x + w - r} ${y + h}H${x}Z`;
  }

  function desenharGrafico(box, linhas, animar){
    const W = Math.max(280, Math.round(box.clientWidth) || 320);
    const alturaLinha = 42, topoNome = 13, topoBarra = 19, alturaBarra = 12, folgaValor = 44;
    const H = linhas.length * alturaLinha;
    const max = Math.max(1, ...linhas.map(l => l.quantidade));
    const util = W - folgaValor;
    const grupos = linhas.map((l, i) => {
      const y = i * alturaLinha, w = l.quantidade / max * util;
      const marca = w > 0
        ? `<g class="barras h"><path d="${barra(0, y + topoBarra, Math.max(w, 2), alturaBarra)}" fill="var(--c1)" pointer-events="none"/></g>`
        : "";
      return `<g class="col" data-i="${i}" style="--d:${Math.round(i * Math.min(30, 240 / linhas.length))}ms">
        <rect class="hit" x="0" y="${y}" width="${W}" height="${alturaLinha}" tabindex="0" data-i="${i}" aria-label="${esc(l.material)}: ${esc(String(l.quantidade))}"/>
        <text class="ylab" x="0" y="${y + topoNome}" pointer-events="none">${esc(l.material)}</text>
        ${marca}
        <text class="tot" x="${Math.max(w, 0) + 6}" y="${y + topoBarra + alturaBarra - 2}" pointer-events="none">${esc(String(l.quantidade))}</text>
      </g>`;
    }).join("");
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Consumo por material">${grupos}</svg>`;
    box.classList.toggle("entra", !!animar);

    const ativar = (alvo, x, y) => {
      const i = Number(alvo.dataset.i);
      box.classList.add("hov");
      box.querySelectorAll("g.col.on").forEach(g => g.classList.remove("on"));
      alvo.closest("g.col").classList.add("on");
      mostrarDica(linhas[i], x, y);
    };
    const desativar = () => {
      box.classList.remove("hov");
      box.querySelectorAll("g.col.on").forEach(g => g.classList.remove("on"));
      esconderDica();
    };
    box.querySelectorAll(".hit").forEach(h => {
      h.addEventListener("pointermove", ev => ativar(h, ev.clientX, ev.clientY));
      h.addEventListener("pointerleave", desativar);
      h.addEventListener("focus", () => {
        const r = h.getBoundingClientRect();
        ativar(h, r.left, r.top + r.height / 2);
      });
      h.addEventListener("blur", desativar);
    });
  }

  function desenharAno(el, dados, ordem, ano){
    if(observador){ observador.disconnect(); observador = null; }
    esconderDica();
    const posicao = m => ordem.has(m) ? ordem.get(m) : Number.MAX_SAFE_INTEGER;
    const linhas = dados.filter(d => String(d.ano) === String(ano))
      .sort((a, b) => b.quantidade - a.quantidade || posicao(a.material) - posicao(b.material) || String(a.material).localeCompare(String(b.material), "pt"));
    const total = linhas.reduce((s, l) => s + l.quantidade, 0);
    el.querySelector("[data-total]").textContent = `${total} unidade${total === 1 ? "" : "s"} em ${ano}`;

    const tabela = linhas.map(l => `<tr><td>${esc(l.material)}</td><td>${esc(String(l.quantidade))}</td></tr>`).join("");
    el.querySelector("[data-tabela]").innerHTML = `<table>
      <thead><tr><th>Material</th><th>Consumo</th></tr></thead>
      <tbody>${tabela}<tr><td>Total</td><td>${esc(String(total))}</td></tr></tbody>
    </table>`;

    const box = el.querySelector("[data-grafico]");
    desenharGrafico(box, linhas, true);
    if(typeof ResizeObserver === "function"){
      let largura = box.clientWidth;
      observador = new ResizeObserver(() => {
        if(!box.isConnected){ observador.disconnect(); observador = null; esconderDica(); return; }
        if(box.clientWidth && box.clientWidth !== largura){
          largura = box.clientWidth;
          desenharGrafico(box, linhas, false);
        }
      });
      observador.observe(box);
    }
  }

  function desenhar(el, historico){
    const dados = consumosPorAno(historico) || [];
    if(!dados.length){
      el.innerHTML = `<div class="card"><div class="panel-b"><p class="empty">Ainda não há consumos para mostrar. O consumo de um material só é calculado quando existem duas verificações com contagem desse material.</p></div></div>`;
      return;
    }
    const anos = [...new Set(dados.map(d => String(d.ano)))].sort((a, b) => b.localeCompare(a));
    const ordem = new Map();
    historico.forEach(v => (v.itens || []).forEach(it => { if(!ordem.has(it.nome)) ordem.set(it.nome, ordem.size); }));

    el.innerHTML = `
      <div class="toolbar">
        <label class="field"><span class="hint">Ano</span>
          <select data-ano>${anos.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("")}</select>
        </label>
        <span class="count" data-total></span>
      </div>
      <div class="met-grid">
        <div class="card full">
          <div class="panel-h"><h3>Consumo por material</h3><span class="sub">unidades, por ordem decrescente</span></div>
          <div class="panel-b"><div class="viz" data-grafico></div></div>
        </div>
        <div class="card full">
          <div class="panel-h"><h3>Listagem</h3></div>
          <div class="panel-b"><div class="vtab"><div class="wrap" data-tabela></div></div></div>
        </div>
      </div>
      <p class="hint" style="margin-top:8px">Consumo = total anterior + reposto − total atual, nunca abaixo de 0. Cada consumo conta no ano da verificação mais recente das duas. Material retirado por estar expirado conta como consumo.</p>`;
    const sel = el.querySelector("[data-ano]");
    sel.addEventListener("change", () => desenharAno(el, dados, ordem, sel.value));
    desenharAno(el, dados, ordem, anos[0]);
  }

  async function carregar(el){
    const pedido = ++pedidoAtual;
    if(observador){ observador.disconnect(); observador = null; }
    esconderDica();
    el.innerHTML = `<p class="empty">A carregar os consumos…</p>`;
    try{
      const historico = await API.pedir("consumos");
      if(pedido !== pedidoAtual) return;
      desenhar(el, historico || []);
    }catch(e){
      if(pedido !== pedidoAtual) return;
      el.innerHTML = `<div class="card"><div class="panel-b">
        <p class="empty">Não foi possível obter os consumos. ${esc(e.message || "")}</p>
        <button class="btn" type="button" data-repetir>Tentar novamente</button>
      </div></div>`;
      el.querySelector("[data-repetir]").addEventListener("click", () => carregar(el));
    }
  }

  registarSeparador({id: "consumos", titulo: "Consumos", requerLogin: true, render: carregar});
})();

/* ============ SEPARADOR SUPORTE (sempre o último) ============ */
(function(){
  "use strict";

  /* CSS só deste separador. O montar.js inclui apenas o app.css, por isso é injetado aqui. Só usa tokens do design. */
  function garantirEstilos(){
    if(document.getElementById("cxSuporteCss")) return;
    const s = document.createElement("style");
    s.id = "cxSuporteCss";
    s.textContent = `
      .cx-sup{display:flex;flex-direction:column;gap:12px}
      .cx-sup .sup-grid{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
      .cx-sup input[type=number]{width:76px}
      .cx-ordem{display:inline-flex;gap:4px}
      .cx-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
      .qr-grelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
      .qr-cartao{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:16px;text-align:center;break-inside:avoid}
      .qr-cartao h4{margin:0 0 4px;font-size:16px}
      .qr-cartao p{margin:0 0 12px}
      .qr-cartao .qr-svg{width:min(220px,100%);margin:0 auto 10px}
      .qr-cartao svg{display:block;width:100%;height:auto}
      .qr-cartao code{display:block;font:500 11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
      @media print{
        body.cx-imprimir-qr *{visibility:hidden!important}
        body.cx-imprimir-qr .qr-grelha,body.cx-imprimir-qr .qr-grelha *{visibility:visible!important}
        body.cx-imprimir-qr .qr-grelha{position:absolute;left:0;top:0;width:100%;grid-template-columns:1fr 1fr}
      }`;
    document.head.append(s);
  }

  const erroCartao = (titulo, e, repetir) => {
    const c = document.createElement("div");
    c.innerHTML = `<p class="empty">Não foi possível obter ${esc(titulo)}. ${esc(e.message || "")}</p>
      <button class="btn small" type="button">Tentar novamente</button>`;
    c.querySelector("button").addEventListener("click", repetir);
    return c;
  };

  /* ---------- Materiais ---------- */
  function validarMateriais(materiais){
    for(const m of materiais){
      if(!Number.isInteger(m.minimo) || m.minimo < 0) return `Mínimo inválido em ${m.nome}: tem de ser um número inteiro igual ou superior a 0.`;
    }
    return "";
  }

  async function iniciarMateriais(box){
    let materiais;
    const carregar = async () => {
      box.innerHTML = `<p class="empty">A carregar os materiais…</p>`;
      try{
        const dados = await API.pedir("materiais");
        materiais = (dados || []).map(m => ({...m})).sort((a, b) => a.ordem - b.ordem);
        desenhar();
      }catch(e){
        box.replaceChildren(erroCartao("os materiais", e, carregar));
      }
    };

    const desenhar = (focar) => {
      const linhas = materiais.map((m, i) => `<tr class="${m.ativo ? "" : "inativo"}" data-i="${i}">
        <td>${esc(m.nome)}</td>
        <td><input type="number" min="0" step="1" inputmode="numeric" value="${esc(String(m.minimo))}" data-campo="minimo" aria-label="Mínimo de ${esc(m.nome)}"></td>
        <td class="numc"><input class="chk" type="checkbox" ${m.validade_obrigatoria ? "checked" : ""} data-campo="validade_obrigatoria" aria-label="Validade obrigatória em ${esc(m.nome)}"></td>
        <td class="numc"><input class="chk" type="checkbox" ${m.ativo ? "checked" : ""} data-campo="ativo" aria-label="${esc(m.nome)} ativo"></td>
        <td><span class="cx-ordem">
          <button class="btn small" type="button" data-mover="-1" aria-label="Subir ${esc(m.nome)}" ${i === 0 ? "disabled" : ""}>↑</button>
          <button class="btn small" type="button" data-mover="1" aria-label="Descer ${esc(m.nome)}" ${i === materiais.length - 1 ? "disabled" : ""}>↓</button>
        </span></td>
      </tr>`).join("");
      box.innerHTML = `
        <div class="tbl-wrap"><table class="sup-tbl">
          <thead><tr><th>Material</th><th>Mínimo</th><th class="center">Validade obrigatória</th><th class="center">Ativo</th><th>Ordem</th></tr></thead>
          <tbody>${linhas || `<tr><td colspan="5" class="empty">Sem materiais.</td></tr>`}</tbody>
        </table></div>
        <p class="note">Desativar retira o material dos próximos registos e da página pública, mas mantém o histórico. Os materiais não se apagam.</p>
        <div class="cx-acoes"><button class="btn primary" type="button" data-gravar>Gravar materiais</button></div>`;

      const corpo = box.querySelector("tbody");
      corpo.addEventListener("input", ev => {
        const c = ev.target.dataset.campo;
        if(c !== "minimo") return;
        materiais[Number(ev.target.closest("tr").dataset.i)].minimo = ev.target.value.trim() === "" ? NaN : Number(ev.target.value);
      });
      corpo.addEventListener("change", ev => {
        const c = ev.target.dataset.campo;
        if(c !== "validade_obrigatoria" && c !== "ativo") return;
        const tr = ev.target.closest("tr");
        materiais[Number(tr.dataset.i)][c] = ev.target.checked;
        if(c === "ativo") tr.classList.toggle("inativo", !ev.target.checked);
      });
      corpo.addEventListener("click", ev => {
        const b = ev.target.closest("button[data-mover]");
        if(!b) return;
        const i = Number(b.closest("tr").dataset.i), d = Number(b.dataset.mover), j = i + d;
        if(j < 0 || j >= materiais.length) return;
        [materiais[i], materiais[j]] = [materiais[j], materiais[i]];
        desenhar({i: j, d});
      });
      box.querySelector("[data-gravar]").addEventListener("click", async ev => {
        const btn = ev.currentTarget;
        const erro = validarMateriais(materiais);
        if(erro){ toast(erro, "erro"); return; }
        btn.disabled = true;
        try{
          const lista = materiais.map((m, i) => ({
            id: m.id, nome: m.nome, ordem: i + 1, minimo: m.minimo,
            validade_obrigatoria: !!m.validade_obrigatoria, ativo: !!m.ativo
          }));
          await API.pedir("materiais-gravar", {materiais: lista});
          materiais = lista;
          desenhar();
          toast("Materiais gravados.");
        }catch(e){
          btn.disabled = false;
          toast(e.message || "Não foi possível gravar os materiais. As alterações mantêm-se nesta página.", "erro");
        }
      });
      if(focar){
        const alvo = corpo.querySelector(`tr[data-i="${focar.i}"] button[data-mover="${focar.d}"]:not(:disabled)`)
          || corpo.querySelector(`tr[data-i="${focar.i}"] button[data-mover]:not(:disabled)`);
        if(alvo) alvo.focus();
      }
    };
    await carregar();
  }

  /* ---------- Emails dos avisos ---------- */
  const EMAIL_VALIDO = /^[^\s@,;<>"']+@[^\s@,;<>"']+\.[^\s@,;<>"'.]{2,}$/;

  async function iniciarEmails(box){
    let emails = [];
    const carregar = async () => {
      box.innerHTML = `<p class="empty">A carregar os emails…</p>`;
      try{
        const dados = await API.pedir("emails");
        emails = (dados || []).slice().sort((a, b) => a.ordem - b.ordem).map(e => e.email);
        desenhar();
      }catch(e){
        box.replaceChildren(erroCartao("os emails", e, carregar));
      }
    };

    const desenhar = () => {
      const chips = emails.map((e, i) => `<span class="chip">${esc(e)}<button type="button" data-i="${i}" aria-label="Remover ${esc(e)}">×</button></span>`).join("");
      box.innerHTML = `
        <div class="chips">${chips}</div>
        ${emails.length ? "" : `<p class="note">Sem destinatários, os avisos não são enviados.</p>`}
        <form class="eml-add" novalidate>
          <input type="email" autocomplete="off" inputmode="email" placeholder="nome@empresa.pt" aria-label="Novo destinatário">
          <button class="btn" type="submit">Adicionar</button>
        </form>
        <div class="cx-acoes"><button class="btn primary" type="button" data-gravar>Gravar emails</button></div>`;

      box.querySelector(".chips").addEventListener("click", ev => {
        const b = ev.target.closest("button[data-i]");
        if(!b) return;
        emails.splice(Number(b.dataset.i), 1);
        desenhar();
      });
      const form = box.querySelector("form"), campo = form.querySelector("input");
      form.addEventListener("submit", ev => {
        ev.preventDefault();
        const novo = campo.value.trim().toLowerCase();
        const invalido = !EMAIL_VALIDO.test(novo);
        campo.classList.toggle("invalido", invalido);
        if(invalido){ toast("Escreva um endereço de email válido.", "erro"); campo.focus(); return; }
        if(emails.some(e => e.toLowerCase() === novo)){ toast("Este destinatário já está na lista.", "erro"); return; }
        emails.push(novo);
        desenhar();
        box.querySelector("form input").focus();
      });
      box.querySelector("[data-gravar]").addEventListener("click", async ev => {
        const btn = ev.currentTarget;
        btn.disabled = true;
        try{
          await API.pedir("emails-gravar", {emails: emails.map((email, i) => ({email, ordem: i}))});
          toast("Emails gravados.");
          btn.disabled = false;
        }catch(e){
          btn.disabled = false;
          toast(e.message || "Não foi possível gravar os emails. As alterações mantêm-se nesta página.", "erro");
        }
      });
    };
    await carregar();
  }

  /* ---------- QR codes ---------- */
  /* Sempre preto sobre branco, em qualquer tema: é o que os leitores de QR esperam. É a única exceção às cores do design. */
  function qrSvg(texto){
    const q = qrcode(0, "M");
    q.addData(texto);
    q.make();
    const n = q.getModuleCount(), margem = 4, total = n + margem * 2;
    let d = "";
    for(let r = 0; r < n; r++) for(let c = 0; c < n; c++){
      if(q.isDark(r, c)) d += `M${c + margem} ${r + margem}h1v1h-1z`;
    }
    return `<svg viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges" role="img" aria-label="QR code para ${esc(texto)}"><rect width="${total}" height="${total}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }

  function enderecoBase(){
    const v = typeof ENDERECO_PUBLICO === "undefined" ? "" : String(ENDERECO_PUBLICO || "").trim();
    if(!v) return "";
    try{
      const u = new URL(v);
      if(u.protocol !== "https:" && u.protocol !== "http:") return "";
      u.hash = "";
      return u.href;
    }catch(e){
      return "";
    }
  }

  function imprimirQr(){
    /* imprime sempre no tema claro, para o texto ficar escuro no papel */
    const raiz = document.documentElement, tinha = raiz.hasAttribute("data-theme"), tema = raiz.getAttribute("data-theme");
    raiz.setAttribute("data-theme", "light");
    document.body.classList.add("cx-imprimir-qr");
    window.addEventListener("afterprint", () => {
      document.body.classList.remove("cx-imprimir-qr");
      if(tinha) raiz.setAttribute("data-theme", tema); else raiz.removeAttribute("data-theme");
    }, {once: true});
    window.print();
  }

  function desenharQr(box){
    const base = enderecoBase();
    if(!base){
      box.innerHTML = `<p class="note">Os QR codes ficam disponíveis quando o endereço público estiver definido, na publicação da app.</p>`;
      return;
    }
    if(typeof qrcode !== "function"){
      box.innerHTML = `<p class="note">Não foi possível gerar os QR codes nesta página.</p>`;
      return;
    }
    const cartoes = [
      {titulo: "Consultar a caixa", texto: "Quantidades e validades, sem abrir a caixa.", url: base + "#caixa"},
      {titulo: "Registo mensal", texto: "Só para os responsáveis. Pede login.", url: base + "#registo"}
    ];
    try{
      box.innerHTML = `<div class="qr-grelha">${cartoes.map(c => `<article class="qr-cartao">
          <h4>${esc(c.titulo)}</h4>
          <p class="hint">${esc(c.texto)}</p>
          <div class="qr-svg">${qrSvg(c.url)}</div>
          <p class="hint">Caixa de 1.os Socorros · Nestlé V.N.Gaia</p>
          <code>${esc(c.url)}</code>
        </article>`).join("")}</div>
        <div class="cx-acoes"><button class="btn primary" type="button" data-imprimir>Imprimir QR codes</button></div>`;
      box.querySelector("[data-imprimir]").addEventListener("click", imprimirQr);
    }catch(e){
      box.innerHTML = `<p class="note">Não foi possível gerar os QR codes. ${esc(e.message || "")}</p>`;
    }
  }

  function render(el){
    garantirEstilos();
    el.innerHTML = `<div class="cx-sup">
      <div class="card"><div class="panel-h"><h3>Materiais e mínimos</h3></div><div class="panel-b" data-materiais></div></div>
      <div class="sup-grid">
        <div class="card"><div class="panel-h"><h3>Emails dos avisos</h3></div><div class="panel-b" data-emails></div></div>
        <div class="card"><div class="panel-h"><h3>QR codes</h3></div><div class="panel-b" data-qr></div></div>
      </div>
    </div>`;
    iniciarMateriais(el.querySelector("[data-materiais]"));
    iniciarEmails(el.querySelector("[data-emails]"));
    desenharQr(el.querySelector("[data-qr]"));
  }

  registarSeparador({id: "suporte", titulo: "Suporte", requerLogin: true, render});
})();
</script>
